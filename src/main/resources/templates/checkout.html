<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Checkout | StyleHub</title><link rel="stylesheet" th:href="@{/style.css}"></head><body><header class="topbar"><a class="brand" href="/">StyleHub</a><nav><a href="/">Shop</a><a href="/cart">Cart</a></nav></header><main class="container page-content narrow"><p class="eyebrow">ALMOST YOURS</p><h1>Checkout</h1><div th:if="${error}" class="alert error" th:text="${error}"></div><div class="panel checkout-panel"><h2>Delivery details</h2><p class="muted" th:text="${customer.fullName} + ' · ' + ${customer.email}"></p><form method="post" action="/checkout" class="form-stack"><label>Delivery address<textarea name="shippingAddress" rows="3" required maxlength="500" placeholder="House / street, city, state, PIN code"></textarea></label><div class="summary-row total"><span>Order total</span><strong th:text="'₹' + ${#numbers.formatDecimal(total,1,2)}"></strong></div><p class="muted small-note">Demo checkout: no real payment is taken.</p><button class="button full" type="submit">Place order</button></form></div></main></body></html>
