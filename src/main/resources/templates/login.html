<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Login | StyleHub</title><link rel="stylesheet" th:href="@{/style.css}"></head><body><header class="topbar"><a class="brand" href="/">StyleHub</a><nav><a href="/">Shop</a><a href="/signup">Sign up</a></nav></header><main class="auth-wrap"><section class="auth-card"><p class="eyebrow">WELCOME BACK</p><h1>Log in</h1><p class="muted">Sign in to checkout and see your orders.</p><div th:if="${error}" class="alert error" th:text="${error}"></div><form method="post" action="/login" class="form-stack"><label>Email address<input type="email" name="email" required autocomplete="email" placeholder="you@example.com"></label><label>Password<input type="password" name="password" required autocomplete="current-password" placeholder="Your password"></label><button class="button full" type="submit">Log in</button></form><p class="form-foot">New to StyleHub? <a href="/signup">Create an account</a></p></section></main></body></html>
