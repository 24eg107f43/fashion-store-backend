<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Create account | StyleHub</title><link rel="stylesheet" th:href="@{/style.css}"></head><body><header class="topbar"><a class="brand" href="/">StyleHub</a><nav><a href="/">Shop</a><a href="/login">Login</a></nav></header><main class="auth-wrap"><section class="auth-card"><p class="eyebrow">JOIN STYLEHUB</p><h1>Create account</h1><p class="muted">A few details and you are ready to shop.</p><div th:if="${error}" class="alert error" th:text="${error}"></div><form method="post" action="/signup" class="form-stack"><label>Full name<input name="fullName" required maxlength="100" autocomplete="name" placeholder="Your name"></label><label>Email address<input type="email" name="email" required autocomplete="email" placeholder="you@example.com"></label><label>Password<input type="password" name="password" required minlength="6" autocomplete="new-password" placeholder="At least 6 characters"></label><button class="button full" type="submit">Create account</button></form><p class="form-foot">Already have an account? <a href="/login">Log in</a></p></section></main></body></html>
