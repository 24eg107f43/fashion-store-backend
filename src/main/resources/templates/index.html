<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>StyleHub | Fashion Store</title><link rel="stylesheet" th:href="@{/style.css}"></head>
<body><header class="topbar"><a class="brand" href="/">StyleHub</a><nav><a href="/">Shop</a><a href="/cart">Cart</a><a href="/orders">Order history</a><span th:if="${customer == null}"><a href="/login">Login</a><a class="nav-button" href="/signup">Sign up</a></span><form th:if="${customer != null}" class="inline" method="post" action="/logout"><span th:text="'Hi, ' + ${customer.fullName}"></span><button class="link-button" type="submit">Log out</button></form></nav></header>
<main class="container"><section class="hero"><div><p class="eyebrow">YOUR EVERYDAY STYLE</p><h1>Find your<br><span>new favourite.</span></h1><p>Easy, comfortable fashion for every day.</p><a class="button" href="#products">Shop collection</a></div><div class="hero-art"><span>STYLE<br>YOUR<br>DAY</span></div></section>
<div th:if="${error}" class="alert error" th:text="${error}"></div><div th:if="${success}" class="alert success" th:text="${success}"></div>
<section id="products"><div class="section-heading"><div><p class="eyebrow">THE COLLECTION</p><h2>Shop our picks</h2></div><p>6 simple essentials</p></div><div class="product-grid"><article class="product-card" th:each="p : ${products}"><div class="product-art" th:classappend="${' art-' + p.id}"><span th:text="${p.category}"></span></div><div class="product-info"><p class="category" th:text="${p.category}"></p><h3 th:text="${p.name}"></h3><p class="description" th:text="${p.description}"></p><div class="product-bottom"><strong th:text="'₹' + ${#numbers.formatDecimal(p.price,1,2)}"></strong><form method="post" th:action="@{/cart/add/{id}(id=${p.id})}"><button class="button small" type="submit">Add to cart</button></form></div><small th:text="${p.stock} + ' in stock'"></small></div></article></div></section>
<footer>StyleHub · Simple fashion, everyday.</footer></main></body></html>
