<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Your cart | StyleHub</title><link rel="stylesheet" th:href="@{/style.css}"></head><body><header class="topbar"><a class="brand" href="/">StyleHub</a><nav><a href="/">Shop</a><a href="/orders">Order history</a><a href="/login" th:if="${customer == null}">Login</a></nav></header><main class="container page-content"><p class="eyebrow">YOUR SELECTION</p><h1>Your cart</h1><div th:if="${error}" class="alert error" th:text="${error}"></div><div th:if="${lines.isEmpty()}" class="empty-state"><h2>Your cart is empty</h2><p>Find something you love in our collection.</p><a class="button" href="/">Continue shopping</a></div><div th:unless="${lines.isEmpty()}" class="cart-layout"><section class="panel"><div class="cart-line" th:each="line : ${lines}"><div class="mini-art">SH</div><div class="cart-detail"><h3 th:text="${line.product.name}"></h3><p th:text="'₹' + ${#numbers.formatDecimal(line.product.price,1,2)}"></p><form method="post" action="/cart/update" class="quantity-form"><input type="hidden" name="productId" th:value="${line.product.id}"><label>Qty <input type="number" name="quantity" min="0" th:attr="max=${line.product.stock}" th:value="${line.quantity}"></label><button class="text-button" type="submit">Update</button></form></div><form method="post" action="/cart/remove"><input type="hidden" name="productId" th:value="${line.product.id}"><button class="text-button" type="submit">Remove</button></form></div></section><aside class="panel summary"><h2>Order summary</h2><div class="summary-row"><span>Subtotal</span><strong th:text="'₹' + ${#numbers.formatDecimal(total,1,2)}"></strong></div><div class="summary-row"><span>Delivery</span><span>Free</span></div><div class="summary-row total"><span>Total</span><strong th:text="'₹' + ${#numbers.formatDecimal(total,1,2)}"></strong></div><a class="button full" href="/checkout">Continue to checkout</a><a class="back-link" href="/">Continue shopping</a></aside></div></main></body></html>
