<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Order history | StyleHub</title><link rel="stylesheet" th:href="@{/style.css}"></head><body><header class="topbar"><a class="brand" href="/">StyleHub</a><nav><a href="/">Shop</a><a href="/cart">Cart</a><form class="inline" method="post" action="/logout"><button class="link-button" type="submit">Log out</button></form></nav></header><main class="container page-content"><p class="eyebrow">YOUR STYLEHUB ACCOUNT</p><h1>Order history</h1><div th:if="${success}" class="alert success" th:text="${success}"></div><div th:if="${orders.isEmpty()}" class="empty-state"><h2>No orders yet</h2><p>Your orders will appear here after checkout.</p><a class="button" href="/">Start shopping</a></div><div class="order-list" th:unless="${orders.isEmpty()}"><article class="panel order-card" th:each="o : ${orders}"><div class="order-head"><div><p class="eyebrow" th:text="'ORDER #' + ${o.id}"></p><h2 th:text="${#temporals.format(o.createdAt, 'dd MMM yyyy, HH:mm')}"></h2></div><span class="status" th:text="${o.status}"></span></div><p th:text="${o.itemsSummary}"></p><div class="summary-row total"><span>Total paid at checkout</span><strong th:text="'₹' + ${#numbers.formatDecimal(o.total,1,2)}"></strong></div></article></div></main></body></html>
